# Launch profiles of the graphical launcher, embedded in the binary (include_str!).
#
# Each [[profile]] applies to a host (os: "windows", "linux" = Proton or Wine, or "any") and a GPU
# vendor (gpu: "nvidia", "amd", "intel", "any"). The most specific match wins: a profile naming both
# fields beats one naming one, which beats the "any" fallback; a tie goes to the first one listed.
#
# status:
#   "measured"   values measured by the maintainer or a contributor on the stated setup (see note);
#   "unmeasured" nothing measured with this profile on this host (VIctory's defaults, or a set
#                measured on another GPU: see note).
# Overrides typed in the launcher's advanced panel always win over [profile.env].
#
# Every variable named here is read by third_party/victory (checked by the launcher's tests). Values "0"
# turn the switch off, as VIctory reads them.

# ---------------------------------------------------------------------------------------------
# Windows: the set VIctory's own launcher plays with (third_party/victory/scripts/play.ps1, without
# -Safe and without its VICTORY_D3D12_DRED=light), the one `anyxboxx run` gives VIctory
# (anyxboxx::run::TUNED; a test checks this table against it). VICTORY_RELAY=2 also makes stage 3
# of the late waits VIctory's default. Measured by avatarmanz (VIctory-7900XTX README, 2026-11-26):
# Windows 11, i9-12900K, RX 7900 XTX, Series X profile with renderer patches 1+2, about 19 fps.
# Not measured on NVIDIA with this base: the NVIDIA profile is the same set, marked unmeasured.
# ---------------------------------------------------------------------------------------------
[[profile]]
id = "windows-nvidia"
name = "Windows + NVIDIA"
os = "windows"
gpu = "nvidia"
status = "unmeasured"
note = "VIctory's play.ps1 set, measured on an RX 7900 XTX; not measured on NVIDIA with this VIctory base."

[profile.env]
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"

[[profile]]
id = "windows-amd"
name = "Windows + AMD (measured set)"
os = "windows"
gpu = "amd"
status = "measured"
note = "VIctory's play.ps1 set, measured by avatarmanz on Windows 11 with an RX 7900 XTX."

[profile.env]
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"

# ---------------------------------------------------------------------------------------------
# Linux (Proton) + AMD: the Windows set plus the Linux additions (anyxboxx::run::LINUX_AMD; a test
# checks this table against it). Measured 2026-11-26 on Fedora 44, RX 9070 XT 16 GB, RADV (Mesa
# 26.2.7 with tools/linux/mesa's patch) through vkd3d-proton, GE-Proton11-12, with the
# tools/linux/anonless shim preloaded: median 15.6 fps in the world, 16-20 fps in cutscenes.
# Needs tools/linux (docs/running-gta6.md, Linux section): the patched RADV fixes the mouths, the
# shim lets VICTORY_PORT_CONSTANTS engage (it turns itself off without it).
# ---------------------------------------------------------------------------------------------
[[profile]]
id = "linux-amd"
name = "Linux (Proton) + AMD"
os = "linux"
gpu = "amd"
status = "measured"
note = "Measured on an RX 9070 XT (RADV, Proton) with tools/linux's patched RADV and shim."

[profile.env]
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_CARD_STEPS = "2"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
# Torn relay fetches under Wine broke skinned meshes; the check keeps VICTORY_CARD_STEPS=2 safe.
VICTORY_FETCH_CHECK = "1"
# The 500 ms default froze a frame once a second while RADV compiles.
VICTORY_PIPELINE_WAIT_MS = "0"
# Renderer patch 1; it checks itself and stays off where the card cannot read title memory in place.
VICTORY_PORT_CONSTANTS = "1"
# The title asks for 1,245,184 views, more than vkd3d-proton's default cap.
VKD3D_CONFIG = "descriptor_heap"

# ---------------------------------------------------------------------------------------------
# Fallbacks: VIctory's own defaults (empty set), nothing measured with these hosts.
# ---------------------------------------------------------------------------------------------
[[profile]]
id = "intel"
name = "Intel GPU"
os = "any"
gpu = "intel"
status = "unmeasured"
note = "VIctory's defaults: no tuned settings have been measured on Intel."

[profile.env]

[[profile]]
id = "other"
name = "Other host or GPU"
os = "any"
gpu = "any"
status = "unmeasured"
note = "VIctory's defaults: nothing is set. Use the advanced panel to try settings yourself."

[profile.env]
